# Notification delivery - Prometheus Alert Rules (6f, 2026-11-13; 05 / e9: a log line is not an alert).
# Operational IaC. Does NOT change application runtime. Metric names are the EXACT Prometheus-exported names
# (registry dots -> underscores).
#
# Load into Prometheus:
#   Copy to: /etc/prometheus/rules/notifications-alerts.yml
#   Then in prometheus.yml:
#     rule_files:
#       - "rules/notifications-alerts.yml"
#
# Metric provenance (backend/services/userNotificationService.ts, notifyCompanyEvent):
#   notification_undeliverable{reason,type}   counter
#     reason: no_active_recipient | membership_unreadable | insert_failed | invalid_input
#     type:   the notification type (campaign_auto_paused, campaign_recovery_generated, campaign_pending_approval,
#             campaign_approved, credit_alert, ...)
# The LOG event NOTIFICATION_UNDELIVERABLE carries the company id for diagnosis; the metric deliberately does not
# (label cardinality).
#
# LIVENESS DEPENDENCY (05, 2026-11-13) - these rules are only as live as the counter behind them:
#   recordRawCounter is safeIncr (backend/observability/metrics.ts), which DROPS every counter when
#   observabilityConfig.enabled is false. That flag is env OBSERVABILITY_ENABLED (backend/observability/config.ts),
#   DEFAULT TRUE. Production state: UNCONFIRMED - asked of virality-83 (an env fact; not read by 6f). Until it is
#   confirmed true AND this file is loaded by the production Prometheus that scrapes the exporter, treat the rules
#   as a RELEASE CONDITION, not a shipped control. Fallback that exists today regardless: the log lines
#   NOTIFICATION_UNDELIVERABLE / NOTIFICATION_INSERT_FAILED - route CreditAlertUndeliverable through log-based
#   alerting if the metric path is off (the one case where nobody noticing has a money consequence).
#
# FIRST-EVENT BLINDNESS, FIXED (a9, 2026-11-20): the registry creates a labelled counter series AT ITS FIRST
# INCREMENT, with value 1 (backend/observability/registry.ts incr), and resets on every deploy. PromQL increase()
# needs two samples, so a series whose first sample is already 1 shows NO increase: `increase(x[15m]) > 0` never
# fired for the FIRST undeliverable credit alert in a process - only for a second one. Every rule below therefore
# counts two disjoint cases: a series that existed at the start of the window (its increase), and a series that
# APPEARED inside it (its whole value, since it started from 0). Proven by monitoring/notifications-alerts.test.yml
# (promtool test rules); the CI job also runs the pre-fix expression and requires it to FAIL the first-event case.
#
# TEST-ALERT PATH (alerts are a release condition: a rule counts only once a test alert has LANDED):
#   Step 1 - rule logic: `promtool test rules monitoring/notifications-alerts.test.yml` (CI: monitoring-rules.yml).
#   Step 2 - routing: the owner presses "Test" on the Grafana contact point each rule routes to (page: sre ->
#            the paging contact point; warnings -> the default one) and confirms the message arrives.
#   Step 3 - end to end: WAITS for the durable source below (b3 ruling (B), 2026-11-20). Then: cb inserts ONE
#            synthetic undeliverable record marked as a test, the owner confirms the page, cb deletes the record.
#            No test company, no credit consumption. Not run before (B): it would certify worker-only coverage.
#
# COVERAGE TODAY - READ THIS BEFORE RELYING ON THESE RULES (a9, 2026-11-20; b3 option C wording):
#   notification_undeliverable is an IN-MEMORY, PER-PROCESS counter. These rules read ONLY the Railway worker's
#   scrape (job="omnivyra-worker"), so they see undeliverable events raised IN THE WORKER and nothing else.
#   Events raised on Vercel (API routes, Vercel crons) are NOT covered: each serverless instance keeps its own
#   counter, a scrape of www.omnivyra.com lands on whichever instance answers, and instances share one label set -
#   so the app job both MISSES events (the instance is recycled unscraped) and can INVENT them (alternating
#   instances read as counter resets). Credit alerts are raised from both sides (checkCreditAlerts callers:
#   creditExecutionServiceContracts.ts, creditGuardService.ts, pages/api/cron/leverage-optimizer.ts), so a credit
#   alert that reached nobody on Vercel does NOT page today. The fix is a DURABLE source (undeliverable events
#   persisted, a worker-side exporter computing from the DB); until it ships these rules are worker-only.
#   Until Steps 2-3 land, OBSERVABILITY_ENABLED is confirmed true in prod and this file is loaded by the prod
#   Prometheus, these rules are a RELEASE CONDITION, not a shipped control.
---
groups:
  - name: notification_delivery
    interval: 60s
    rules:
      # `x + 0` in each rule: arithmetic drops __name__, so both `or` branches carry IDENTICAL label sets. The
      # branches are disjoint today (one needs `x offset W`, the other its absence), so removing `+ 0` would change
      # nothing a test can see - KEEP IT: if an edit ever broke that disjointness, identical label sets make
      # Prometheus fail loudly on a duplicate series instead of quietly raising two alerts for one event (7c).
      # A credit alert that reached NOBODY: the company has no active COMPANY_ADMIN (or its memberships could not be
      # read). Money-adjacent silence - credit exhaustion would go unannounced. Page.
      - alert: CreditAlertUndeliverable
        expr: |
          ((increase(notification_undeliverable{job="omnivyra-worker",type="credit_alert"}[15m]) and notification_undeliverable{job="omnivyra-worker",type="credit_alert"} offset 15m)
          or (notification_undeliverable{job="omnivyra-worker",type="credit_alert"} + 0 unless notification_undeliverable{job="omnivyra-worker",type="credit_alert"} offset 15m)) > 0
        for: 0m
        labels: { severity: critical, component: notifications, category: money, page: sre }
        annotations:
          summary: "A credit alert was not delivered to anyone ({{ $labels.reason }})"
          description: "notifyCompanyEvent could not deliver a credit_alert (reason={{ $labels.reason }}). Find the company in the NOTIFICATION_UNDELIVERABLE log line; a company with zero active COMPANY_ADMINs is unreachable for every company-level alert."

      # Any company event delivered to nobody.
      - alert: NotificationUndeliverable
        expr: |
          ((increase(notification_undeliverable{job="omnivyra-worker",type!="credit_alert"}[30m]) and notification_undeliverable{job="omnivyra-worker",type!="credit_alert"} offset 30m)
          or (notification_undeliverable{job="omnivyra-worker",type!="credit_alert"} + 0 unless notification_undeliverable{job="omnivyra-worker",type!="credit_alert"} offset 30m)) > 0
        for: 0m
        labels: { severity: warning, component: notifications, category: correctness }
        annotations:
          summary: "A company notification was not delivered ({{ $labels.type }}, {{ $labels.reason }})"
          description: "notifyCompanyEvent dropped a {{ $labels.type }} event (reason={{ $labels.reason }}). See the NOTIFICATION_UNDELIVERABLE log line for the company."

      # Insert failures in bulk point at a schema / privilege regression (the original defect class: columns that do
      # not exist), not at one company.
      - alert: NotificationInsertFailing
        expr: |
          sum((increase(notification_undeliverable{job="omnivyra-worker",reason="insert_failed"}[15m]) and notification_undeliverable{job="omnivyra-worker",reason="insert_failed"} offset 15m)
          or (notification_undeliverable{job="omnivyra-worker",reason="insert_failed"} + 0 unless notification_undeliverable{job="omnivyra-worker",reason="insert_failed"} offset 15m)) > 5
        for: 5m
        labels: { severity: critical, component: notifications, category: correctness, page: sre }
        annotations:
          summary: "Notification inserts are failing ({{ $value }} in 15m)"
          description: "Repeated insert_failed: check the notifications columns / grants (20270217000035) and recent deploys."
