name: Auth Integrity

# Static auth invariants ONLY — hermetic: node builtins only (fs + path), no
# secrets, no network, no database, no node_modules. Runs on every PR and feeds
# the required status context "Static auth invariants (hermetic, no secrets)".
#
# ─────────────────────────────────────────────────────────────────────────────
# HOSTED E2E RETIRED (docs/supabase-e2e-retirement/15-application-and-ci-
# connection-transition.md, stage 2). The live browser regression suite that
# used to run here against the hosted, long-lived E2E Supabase project (the
# `e2e-secrets-preflight` and `auth-integrity` jobs, fed by E2E_-prefixed
# repository secrets) has been REPLACED by .github/workflows/auth-integrity-
# local.yml, which runs the same five specs against a DISPOSABLE Supabase stack
# created and destroyed on the runner. This file reads NO repository secret and
# reaches NO hosted project. tests/auth/authIntegrityWorkflow.spec.ts and
# tests/auth/hostedSupabaseConnections.spec.ts fail if either is reintroduced.
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT THE STATIC CHECK ENFORCES: the auth callback must fail CLOSED (no
# auth.getSession() fallback, session only from token exchange, clear browser
# state on failure), and NO feature file may read or write the global
# `selected_company_id` / `company_id` localStorage keys, which is a
# cross-tenant leakage vector. Tenant-authorization fixes are landing
# regularly; that invariant should be checked on the PR that would break it.
#
on:
  # Repo-wide on purpose: the localStorage invariant is scanned across EVERY
  # .js/.jsx/.ts/.tsx file, so a path filter would miss a violation introduced in
  # a file the filter does not list. The job costs seconds and installs nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: auth-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deliberately installs NOTHING. scripts/check-auth-integrity-invariants.js
  # requires only `fs` and `path` (Node builtins), so `npm ci` would add ~2
  # minutes and a lockfile dependency for zero benefit. If that script ever grows
  # a third-party import this job fails loudly on the missing module rather than
  # skipping — which is the correct outcome, not a silent pass.
  auth-invariants-static:
    name: Static auth invariants (hermetic, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail loudly if the checker is renamed or deleted, rather than letting the
      # invariant quietly stop being enforced.
      - name: Verify the invariant checker exists
        run: test -f scripts/check-auth-integrity-invariants.js

      # Auth callback must fail CLOSED; no feature file may touch the global
      # selected_company_id / company_id localStorage keys (cross-tenant vector).
      - name: Static auth integrity invariants
        run: node scripts/check-auth-integrity-invariants.js
