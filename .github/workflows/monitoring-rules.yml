# Monitoring rules (a9, 2026-11-20): Prometheus alert rules are a RELEASE CONDITION, so their logic is tested.
#
# 1. `promtool check rules` - every rule file parses.
# 2. `promtool test rules`  - monitoring/notifications-alerts.test.yml: one event pages, resolution, replicas,
#    thresholds, read failure, a missing exporter.
# 3. CONTROL - the credit rule's `> 0` is replaced by `> 1` in a copy of the rules and the same tests are run; that
#    run MUST FAIL (one undelivered credit alert must page). If the control ever passes, the tests no longer
#    distinguish a correct rule from one that misses a single event, and this job goes red.
#
# Supply chain: promtool comes from the official Prometheus GitHub release; the tarball is verified against the
# SHA-256 below before anything is executed; actions/checkout is pinned by full commit SHA (v4.2.2). No secret,
# no third-party action.
name: monitoring-rules

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-rules.yml'
  push:
    # integration/**: cb's push-based CI branches (workflow_dispatch only works once this file is on main).
    branches: [main, 'integration/**']
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-rules.yml'

permissions:
  contents: read

jobs:
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: 2.53.3
      # sha256 of prometheus-2.53.3.linux-amd64.tar.gz from the release's PUBLISHED sha256sums.txt, fetched
      # independently (cb, 2026-11-20). On a version bump, take the new value from that file - NEVER from the
      # 'sha256 <got>' a failing run prints: that certifies whatever was downloaded, tampered or not (7c).
      PROM_SHA256: ebe549477a699c464a0cef0d8d55c0cc9972a1b301fc910b5f260cfc3e08f6a3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install promtool (verified)
        run: |
          set -euo pipefail
          tgz="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/${tgz}"
          got="$(sha256sum "$tgz" | cut -d' ' -f1)"
          echo "sha256 ${got}"
          if [ "$got" != "$PROM_SHA256" ]; then echo "::error::promtool tarball sha256 mismatch (got ${got})"; exit 1; fi
          tar -xzf "$tgz" --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"
          ./promtool --version

      - name: Check every rule file parses
        # Every alert / recording rule file in monitoring/ (not only the one this job was written for).
        run: ./promtool check rules monitoring/*-alerts.yml monitoring/*-rules.yml

      - name: Rule unit tests
        # Every monitoring/*.test.yml, so a rules file that gains a test is covered without editing this job.
        run: ./promtool test rules monitoring/*.test.yml

      - name: CONTROL - an off-by-one credit threshold must FAIL the one-event case
        run: |
          set -uo pipefail
          d="$(mktemp -d)"
          cp monitoring/notifications-alerts.test.yml "$d/"
          python3 - monitoring/notifications-alerts.yml "$d/notifications-alerts.yml" <<'PY'
          import sys
          s = open(sys.argv[1], encoding='utf-8').read()
          old = 'type="credit_alert"}) > 0\n'
          assert s.count(old) == 1, s.count(old)
          open(sys.argv[2], 'w', encoding='utf-8').write(s.replace(old, 'type="credit_alert"}) > 1\n'))
          PY
          grep -n -A1 'alert: CreditAlertUndeliverable' "$d/notifications-alerts.yml"
          if ./promtool test rules "$d/notifications-alerts.test.yml"; then
            echo "::error::CONTROL PASSED: the tests cannot tell a page on ONE undelivered credit alert from none"; exit 1
          fi
          echo "control failed as required"
