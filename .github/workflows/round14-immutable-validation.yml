# Round 14: immutable unit and regression validation (CI-only; owner-approved 2026-11-26).
# Runs the round-12 remediation suites and the Market Pulse comparison against three PINNED full SHAs.
# No deploy, no secrets, read-only token. workflow_dispatch only works for workflows on the default
# branch, so this file also triggers on a push to THIS branch only (the owner-approved push is the trigger).
name: Round 14 — Immutable Unit and Regression Validation

on:
  workflow_dispatch: {}
  push:
    branches: [round14/ci-unit-regression-validation]

permissions:
  contents: read

env:
  BASE_SHA: 2bc52db7a4027c1cf0276017719c821b537f48bf
  CRM_SHA: 4cca827d4718efcfaaec4cf9dd074d3753f33fdc
  PROV_SHA: 7611ec2fd9062775623ddf3b3a1d62af3f11b779

jobs:
  crm:
    name: Outbound CRM security tests (4cca827d4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CRM_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the checked-out commit is the pinned SHA
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ env.CRM_SHA }}"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected" || { echo "::error::checked-out SHA $actual != pinned $expected"; exit 1; }
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "${{ env.BASE_SHA }}" || { echo "::error::parent $parent != baseline"; exit 1; }
          echo "ACTUAL_SHA=$actual" >> "$GITHUB_ENV"
      - name: Discover the commit's test files from its own diff and compare with the pinned list
        run: |
          git diff --name-only HEAD^ HEAD -- backend/tests tests | sort > discovered.txt
          printf '%s\n' backend/tests/unit/outboundCrmSyncRoute.test.ts backend/tests/unit/outboundCrmSyncService.test.ts | sort > pinned.txt
          echo "discovered:"; cat discovered.txt
          diff pinned.txt discovered.txt || { echo "::error::diff-derived test files differ from the pinned list"; exit 1; }
      - name: Setup Node (repo convention)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from the existing lockfile
        run: npm ci
      - name: Run jest (repo invocation; hermetic placeholders, no secrets)
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-hermetic-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-hermetic-placeholder-anon-key
          REDIS_URL: 'redis://localhost:6379'
          OPENAI_API_KEY: 'sk-ci-hermetic-placeholder'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          set +e
          node -v > node.txt; npm -v > npm.txt
          node ./node_modules/jest/bin/jest.js --runTestsByPath \
            backend/tests/unit/outboundCrmSyncRoute.test.ts \
            backend/tests/unit/outboundCrmSyncService.test.ts \
            backend/tests/unit/tenantAuthzDetectorParity.test.ts \
            backend/tests/unit/platformOnlyRouteAuthorization.test.ts \
            backend/tests/unit/sec91W2AVerticalRbac.test.ts \
            --runInBand --forceExit --json --outputFile=results.json 2>&1 | tee jest.log
          echo "JEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Route-auth checkers (existing repo scripts)
        if: always()
        run: |
          rc=0; summary=""
          for s in check-route-auth.js check-route-policy.js check-tenant-authz.js route-auth-ordering.js; do
            node "scripts/$s" > "checker-$s.log" 2>&1; e=$?; echo "$s exit $e"; summary="$summary $s=$e"; [ $e -eq 0 ] || rc=1
          done
          echo "EXTRA=route checkers:$summary" >> "$GITHUB_ENV"
          echo "CHECKERS_RC=$rc" >> "$GITHUB_ENV"
      - name: Record metadata
        if: always()
        run: |
          node -e "const fs=require('fs');const r=(f)=>{try{return fs.readFileSync(f,'utf8').trim()}catch{return null}};fs.writeFileSync('meta.json',JSON.stringify({job:process.env.JOB,expectedSha:process.env.EXP,actualSha:process.env.ACTUAL_SHA||null,node:r('node.txt'),npm:r('npm.txt'),jestExit:process.env.JEST_EXIT===undefined?null:Number(process.env.JEST_EXIT),extra:process.env.EXTRA||''}))"
          cat meta.json
        env:
          JOB: crm
          EXP: ${{ env.CRM_SHA }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm
          path: |
            meta.json
            results.json
            jest.log
            checker-*.log
          if-no-files-found: warn
      - name: Fail the job if jest failed
        if: always()
        run: test "${JEST_EXIT:-1}" = "0"
      - name: Fail the job if a route checker failed
        if: always()
        run: test "${CHECKERS_RC:-1}" = "0"

  prov:
