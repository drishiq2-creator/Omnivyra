          printf '%s\n' backend/tests/unit/authSubsystemBoot.test.ts backend/tests/unit/buildProvenanceRuntime.test.ts backend/tests/unit/buildProvenanceStamp.test.ts backend/tests/unit/provenanceEnvEmptyString.test.ts backend/tests/unit/schemaManifestHash.test.ts | sort > pinned.txt
          echo "discovered:"; cat discovered.txt
          diff pinned.txt discovered.txt || { echo "::error::diff-derived test files differ from the pinned list"; exit 1; }
      - name: Confirm no real deployment stamp is present (tests build their own fixtures)
        run: test ! -e generated/build-provenance/stamp.json
      - name: Setup Node (repo convention)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from the existing lockfile
        run: npm ci
      - name: Run jest (repo invocation; hermetic placeholders, no secrets)
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-hermetic-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-hermetic-placeholder-anon-key
          REDIS_URL: 'redis://localhost:6379'
          OPENAI_API_KEY: 'sk-ci-hermetic-placeholder'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          set +e
          node -v > node.txt; npm -v > npm.txt
          node ./node_modules/jest/bin/jest.js --runTestsByPath \
            backend/tests/unit/authSubsystemBoot.test.ts \
            backend/tests/unit/buildProvenanceRuntime.test.ts \
            backend/tests/unit/buildProvenanceStamp.test.ts \
            backend/tests/unit/provenanceEnvEmptyString.test.ts \
            backend/tests/unit/schemaManifestHash.test.ts \
            backend/tests/unit/authSubsystemBootFailureLifecycle.test.ts \
            backend/tests/unit/schemaManifestCheck.test.ts \
            backend/tests/unit/authResolverBootLifecycle.test.ts \
            backend/tests/unit/schemaHealthFailureLifecycle.test.ts \
            backend/tests/unit/sec91W2BConnectorAuth.test.ts \
            backend/tests/unit/piWs4bOwnedIdentityRegistryBinding.test.ts \
            backend/tests/unit/evidencePlatform.test.ts \
            backend/tests/unit/operationsCenterService.test.ts \
            backend/tests/unit/mediaStorageContract.test.ts \
            backend/tests/unit/platformOnlyRouteAuthorization.test.ts \
            --runInBand --forceExit --json --outputFile=results.json 2>&1 | tee jest.log
          echo "JEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Record metadata
        if: always()
        run: |
          node -e "const fs=require('fs');const r=(f)=>{try{return fs.readFileSync(f,'utf8').trim()}catch{return null}};fs.writeFileSync('meta.json',JSON.stringify({job:process.env.JOB,expectedSha:process.env.EXP,actualSha:process.env.ACTUAL_SHA||null,node:r('node.txt'),npm:r('npm.txt'),jestExit:process.env.JEST_EXIT===undefined?null:Number(process.env.JEST_EXIT),extra:process.env.EXTRA||''}))"
          cat meta.json
        env:
          JOB: prov
          EXP: ${{ env.PROV_SHA }}
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prov
          path: |
            meta.json
            results.json
            jest.log
            checker-*.log
          if-no-files-found: warn
      - name: Fail the job if jest failed
        if: always()
        run: test "${JEST_EXIT:-1}" = "0"

