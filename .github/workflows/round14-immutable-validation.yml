  consolidate:
    name: Consolidated results
    needs: [crm, prov, baseline-prov, market-pulse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all job results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Consolidate (fails if any required suite is missing, failed or not executed)
        run: |
          cat > consolidate.js <<'CONSOLIDATE_EOF'
          // Round 14 consolidation. Reads artifacts/<job>/{meta.json,results.json}; writes a markdown summary to
          // stdout; exits 1 if any REQUIRED expectation is not met. Never treats a missing/unexecuted test as passing.
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2] || 'artifacts';
          const strip = (s) => String(s || '').replace(/\u001b\[[0-9;]*m/g, '');
          const base = (p) => String(p).split(/[\\/]/).pop();
          const out = [];
          const problems = [];
          const load = (job) => {
            const dir = path.join(root, job);
            const read = (f) => { try { return JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8')); } catch { return null; } };
            return { meta: read('meta.json'), res: read('results.json') };
          };
          const perFile = (res) => {
            const m = {};
            for (const t of (res && res.testResults) || []) {
              const a = t.assertionResults || [];
              m[base(t.name)] = {
                total: a.length,
                passed: a.filter((x) => x.status === 'passed').length,
                failed: a.filter((x) => x.status === 'failed').length,
                notRun: a.filter((x) => x.status !== 'passed' && x.status !== 'failed').length,
                suiteStatus: t.status,
                suiteError: t.status === 'failed' && a.length === 0 ? strip(t.message).slice(0, 300) : '',
                failures: a.filter((x) => x.status === 'failed').map((x) => ({
                  name: x.fullName,
                  // signature: first non-empty line of the first failure message, with paths/line numbers normalised
                  sig: strip((x.failureMessages || [''])[0]).split('\n').map((l) => l.trim()).filter(Boolean)[0] || '',
                  message: strip((x.failureMessages || []).join('\n')).slice(0, 4000),
                })),
              };
            }
            return m;
          };
          const norm = (s) => s.replace(/[A-Za-z]:[\\/][^\s)]+|\/home\/runner\/[^\s)]+/g, '<path>').replace(/:\d+:\d+/g, ':L:C');

          function section(job, title, expected) {
            const { meta, res } = load(job);
            out.push(`## ${title}`);
            if (!meta) { problems.push(`${job}: no meta.json (job did not complete)`); out.push('**NO RESULT: job did not produce metadata.**', ''); return null; }
            out.push(`- expected SHA \`${meta.expectedSha}\`; checked-out SHA \`${meta.actualSha}\` → ${meta.expectedSha === meta.actualSha ? 'MATCH' : '**MISMATCH**'}`);
            out.push(`- node ${meta.node}, npm ${meta.npm}, jest exit ${meta.jestExit}${meta.extra ? `; ${meta.extra}` : ''}`);
            if (meta.expectedSha !== meta.actualSha) problems.push(`${job}: SHA mismatch`);
            if (!res) { problems.push(`${job}: no jest results`); out.push('**NO RESULT: jest produced no JSON.**', ''); return null; }
            const pf = perFile(res);
            out.push(`- totals: tests ${res.numTotalTests}, passed ${res.numPassedTests}, failed ${res.numFailedTests}, pending ${res.numPendingTests}, todo ${res.numTodoTests || 0}; suites ${res.numTotalTestSuites} (failed ${res.numFailedTestSuites}, runtime-error ${res.numRuntimeErrorTestSuites || 0})`, '');
            out.push('| file | total | passed | failed | not run |', '|---|---|---|---|---|');
            for (const [f, s] of Object.entries(pf).sort()) out.push(`| ${f} | ${s.total} | ${s.passed} | ${s.failed} | ${s.notRun} |`);
            out.push('');
            if (expected) {
              for (const f of expected.files) {
                const s = pf[f];
                if (!s) { problems.push(`${job}: required file ${f} did not execute`); continue; }
                if (s.total === 0) problems.push(`${job}: ${f} executed 0 tests${s.suiteError ? ` (${s.suiteError})` : ''}`);
                if (s.failed > 0) problems.push(`${job}: ${f} has ${s.failed} failed test(s)`);
                if (s.notRun > 0) problems.push(`${job}: ${f} has ${s.notRun} test(s) not run (skipped/pending/todo)`);
              }
              for (const [label, files, n] of expected.counts || []) {
                const got = files.reduce((acc, f) => acc + ((pf[f] && pf[f].total) || 0), 0);
                out.push(`- count check **${label}**: expected ${n}, got ${got} → ${got === n ? 'OK' : '**MISMATCH**'}`);
                if (got !== n) problems.push(`${job}: ${label} expected ${n}, got ${got}`);
              }
              if (expected.requireExitZero && meta.jestExit !== 0) problems.push(`${job}: jest exit ${meta.jestExit}`);
            }
            for (const [f, s] of Object.entries(pf)) for (const x of s.failures) out.push(`- FAILED \`${f}\` › ${x.name}`, '```', x.message.slice(0, 1500), '```');
            out.push('');
            return pf;
          }

          const CRM_NEW = ['outboundCrmSyncService.test.ts', 'outboundCrmSyncRoute.test.ts'];
          const CRM_REG = ['tenantAuthzDetectorParity.test.ts', 'platformOnlyRouteAuthorization.test.ts', 'sec91W2AVerticalRbac.test.ts'];
          const PROV_NEW = ['buildProvenanceRuntime.test.ts', 'buildProvenanceStamp.test.ts', 'schemaManifestHash.test.ts'];
          const PROV_MOD = ['authSubsystemBoot.test.ts', 'provenanceEnvEmptyString.test.ts'];
          const PROV_REG = ['authSubsystemBootFailureLifecycle.test.ts', 'schemaManifestCheck.test.ts', 'authResolverBootLifecycle.test.ts',
            'schemaHealthFailureLifecycle.test.ts', 'sec91W2BConnectorAuth.test.ts', 'piWs4bOwnedIdentityRegistryBinding.test.ts',
            'evidencePlatform.test.ts', 'operationsCenterService.test.ts', 'mediaStorageContract.test.ts', 'platformOnlyRouteAuthorization.test.ts'];
          const MP = ['marketPulseAutomationDefaultOff.test.ts', 'marketPulseAutomationProducersGated.test.ts', 'marketPulseAutomationWriterGated.test.ts',
            'marketPulseConsumer.test.ts', 'marketPulseFailedLoad.test.tsx', 'piProvIngestionMarketPulse.test.ts', 'piProvMarketPulseObservations.test.ts',
            'piWs3MarketPulseConsumption.test.ts', 'profileMarketPulseMirror.test.ts', 'uiMarketPulseAdminLink.test.tsx'];

          out.push('# Round 14: immutable unit and regression validation', '');
          const crm = section('crm', 'Outbound CRM security @ 4cca827d4718efcfaaec4cf9dd074d3753f33fdc',
            { files: [...CRM_NEW, ...CRM_REG], counts: [['new CRM tests', CRM_NEW, 40]], requireExitZero: true });
          const prov = section('prov', 'Build provenance @ 7611ec2fd9062775623ddf3b3a1d62af3f11b779',
            { files: [...PROV_NEW, ...PROV_MOD, ...PROV_REG], counts: [['new provenance tests', PROV_NEW, 55]], requireExitZero: true });
          const bprov = section('baseline-prov', 'Baseline modified-file counts @ 2bc52db7a4027c1cf0276017719c821b537f48bf',
            { files: PROV_MOD, requireExitZero: true });
          if (prov && bprov) {
            const d = PROV_MOD.reduce((acc, f) => acc + (((prov[f] || {}).total || 0) - ((bprov[f] || {}).total || 0)), 0);
            out.push(`## Additions to existing files`, `- tests in ${PROV_MOD.join(', ')}: branch minus baseline = ${d} (expected 3) → ${d === 3 ? 'OK' : '**MISMATCH**'}`, '');
            if (d !== 3) problems.push(`additions delta expected 3, got ${d}`);
          }
          const mp = {};
          for (const k of ['baseline', 'crm', 'prov']) mp[k] = section(`market-pulse-${k}`, `Market Pulse @ ${k}`, { files: MP });
          out.push('## Market Pulse comparison', '', '| suite | baseline | crm | prov | signatures match |', '|---|---|---|---|---|');
          for (const f of MP) {
            const cell = (k) => { const s = mp[k] && mp[k][f]; return s ? `${s.passed}/${s.total}${s.failed ? ` (${s.failed} failed)` : ''}` : 'not run'; };
            const sigs = ['baseline', 'crm', 'prov'].map((k) => {
              const s = mp[k] && mp[k][f];
              return s ? JSON.stringify(s.failures.map((x) => `${x.name} :: ${norm(x.sig)}`).sort()) : 'missing';
            });
            out.push(`| ${f} | ${cell('baseline')} | ${cell('crm')} | ${cell('prov')} | ${sigs.every((s) => s === sigs[0]) ? 'yes' : '**NO**'} |`);
          }
          out.push('');
          const introduced = [];
          for (const k of ['crm', 'prov']) for (const f of MP) {
            const b = new Set(((mp.baseline || {})[f] || { failures: [] }).failures.map((x) => x.name));
            for (const x of ((mp[k] || {})[f] || { failures: [] }).failures) if (!b.has(x.name)) introduced.push(`${k}: ${f} › ${x.name}`);
          }
          out.push(`- Market Pulse failures on a branch but NOT on baseline (introduced): ${introduced.length ? introduced.join('; ') : 'none'}`, '');
          if (introduced.length) problems.push(`Market Pulse: ${introduced.length} failure(s) not present at baseline`);
          out.push('## Verdict', problems.length ? problems.map((p) => `- ❌ ${p}`).join('\n') : '- ✅ every required expectation met', '');
          process.stdout.write(out.join('\n') + '\n');
          process.exit(problems.length ? 1 : 0);
          CONSOLIDATE_EOF
          set +e
          node consolidate.js artifacts > summary.md; rc=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"; cat summary.md
          exit $rc
      - name: Upload consolidated summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-summary
          path: summary.md
